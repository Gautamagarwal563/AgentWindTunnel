[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windtunnel-ai"
version = "0.1.0"
description = "Catch prompt regressions before they reach production"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Windtunnel"}]
keywords = ["ai", "llm", "testing", "prompt", "regression"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["requests>=2.28", "click>=8.0"]

[project.scripts]
windtunnel = "windtunnel.cli:cli"

[project.urls]
Homepage = "https://windtunnel.app"
Documentation = "https://windtunnel.app/docs"

[tool.setuptools.packages.find]
where = ["."]
